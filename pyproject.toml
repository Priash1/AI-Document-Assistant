[project]
name = "private-docs-ai"
version = "1.0.0"
description = "Zero-knowledge proof-of-permission for privacy-preserving document Q&A"
requires-python = ">=3.11,<3.15"
dependencies = [
    "faiss-cpu>=1.10,<2",
    "numpy>=1.26,<3",
    "openai>=2.43,<3",
    "pymupdf>=1.26,<2",
    "sentence-transformers>=5.1,<6",
    "streamlit>=1.50,<2",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"scripts/create_demo_pdf.py" = ["E501"]
