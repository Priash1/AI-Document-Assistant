name: PrivateDocs verification

on:
  push:
    branches: [main, "hackathon/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: privatedocs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python privacy and RAG tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: python -m pip install --upgrade pip

      - run: python -m pip install -r requirements-dev.txt

      - run: python -m unittest discover -s tests -p "test_*.py" -v

      - run: python -m ruff check app.py utils tests

  midnight-source:
    name: Compact and Midnight source checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: midnight

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: midnight/package-lock.json

      - run: npm ci

      - name: Install supported Compact toolchain
        uses: midnightntwrk/setup-compact-action@836895c8fffbbea6bd986af2b17e8941ff29d1f8
        with:
          compact-version: "0.31.1"

      - run: npm run compile

      - run: npm run build

      - run: npm test

  midnight-real-e2e:
    name: Real local Midnight proof lifecycle
    needs: midnight-source
    runs-on: ubuntu-latest
    timeout-minutes: 40

    defaults:
      run:
        working-directory: midnight

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: midnight/package-lock.json

      - run: npm ci

      - name: Install supported Compact toolchain
        uses: midnightntwrk/setup-compact-action@836895c8fffbbea6bd986af2b17e8941ff29d1f8
        with:
          compact-version: "0.31.1"

      - name: Start devnet, compile and deploy
        run: npm run setup

      - name: Inspect generated Compact contract
        run: |
          echo "=== Generated Compact files ==="
          find contracts/managed/private-docs -maxdepth 3 -type f -print
          echo "=== StateValue / registerDocument references ==="
          grep -Rni -C 8 -E "registerDocument|registeredDocuments|StateValue" contracts/managed/private-docs || true

      - name: Prove register, authorize, consume, replay block and revoke
        run: npm run test:e2e

      - name: Show service diagnostics on failure
        if: failure()
        run: docker compose ps && docker compose logs --no-color --tail=200

      - name: Stop local Midnight stack
        if: always()
        run: docker compose down --volumes --remove-orphans